<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiche Bilan Pompier</title><style>body{font-family:Arial,sans-serif;margin:20px;max-width:1000px}fieldset{margin:12px 0;padding:12px}label{display:block;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}input,textarea,select{width:100%;padding:6px;box-sizing:border-box}h1{text-align:center}.print{margin:10px 0}</style></head><body><h1>Fiche Bilan Pompier</h1><button class="print" onclick="window.print()">Imprimer</button><form><fieldset><legend>Intervention</legend><div class="grid"><div><label>Date<input type="date"></label></div><div><label>Heure<input type="time"></label></div><div><label>Numéro d'intervention<input type="text"></label></div></div></fieldset><fieldset><legend>Victime</legend><div class="grid"><div><label>Nom<input type="text"></label></div><div><label>Prénom<input type="text"></label></div><div><label>Âge<input type="number"></label></div><div><label>Sexe<select><option>Homme</option><option>Femme</option></select></label></div></div></fieldset><fieldset><legend>Constantes</legend><div class="grid"><label>FC<input type="text"></label><label>TA<input type="text"></label><label>SpO2<input type="text"></label><label>FR<input type="text"></label><label>Température<input type="text"></label><label>Glycémie<input type="text"></label></div></fieldset><fieldset><legend>Bilan</legend><label>Motif<textarea rows="3"></textarea></label><label>Observations<textarea rows="5"></textarea></label><label>Gestes effectués<textarea rows="4"></textarea></label></fieldset><fieldset><legend>Évacuation</legend><div class="grid"><label>Destination<input type="text"></label><label>Moyen de transport<input type="text"></label></div></fieldset></form></body></html>
