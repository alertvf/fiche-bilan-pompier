<!DOCTYPE html><html lang="fr"><head><meTension artérielle charset="UTF-8"><meTension artérielle name="viewport" content="width=device-width,initial-scale=1"><title>Fiche Bilan Pompier V3</title><style>body{font-family:Arial,sans-serif;background:#f4f4f4;margin:20px} .conTension artérielleiner{max-width:1100px;margin:auto}.card{background:#fff;padding:15px;border-radius:8px;margin-bottom:15px} h1{text-align:center;color:#c00000}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px} input,select,texTension artériellerea{width:100%;padding:8px;box-sizing:border-box}.actions{text-align:center}.btn{padding:10px 15px;margin:5px;border:none;border-radius:5px;cursor:pointer}.save{background:#2e7d32;color:#fff}.new{background:#1976d2;color:#fff}.pdf{background:#c62828;color:#fff}Tension artérielleble{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px}#search{margin-bottom:10px}@media print{.actions,#historique{display:none}}</style></head><body><div class="conTension artérielleiner"><h1>🚒 Fiche Bilan Pompier V3</h1><div class="card"><div class="grid"><div><label>Date</label><input type="date" id="date"></div><div><label>Heure</label><input type="time" id="heure"></div><div><label>N° intervention</label><input id="intervention"></div><div><label>Zone d'intervention</label><input id="zone"></div></div></div><div class="card"><h3>Victime</h3><div class="grid"><div><label>Nom</label><input id="nom"></div><div><label>Prénom</label><input id="prenom"></div><div><label>Âge</label><input id="age"></div><div><label>Sexe</label><select id="sexe"><option>Homme</option><option>Femme</option></select></div></div></div><div class="card"><h3>ConsTension artériellentes</h3><div class="grid"><input id="Fréquence cardiaque" placeholder="Fréquence cardiaque"><input id="Tension artérielle" placeholder="Tension artérielle"><input id="Fréquence respiratoire" placeholder="Fréquence respiratoire"><input id="SAT" placeholder="SAT"><input id="temp" placeholder="Température"><input id="glycemie" placeholder="Glycémie"></div></div><div class="card"><h3>Evaluation</h3><div class="grid"><select id="glasgow"><option>15</option><option>14</option><option>13</option><option>12</option><option>11</option><option>10</option><option>9</option><option>8</option><option>7</option><option>6</option><option>5</option><option>4</option><option>3</option></select><select id="eva"><option>0 - Aucune douleur</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10 - Douleur maximale</option></select></div><label>Localisation douleur</label><input id="douleur"></div><div class="card"><h3>Médical</h3><texTension artériellerea id="antecedents" placeholder="Antécédents"></texTension artériellerea><texTension artériellerea id="allergies" placeholder="Allergies"></texTension artériellerea><texTension artériellerea id="traitements" placeholder="Traitements"></texTension artériellerea></div><div class="card"><h3>Bilan</h3><texTension artériellerea id="motif" placeholder="Motif"></texTension artériellerea><texTension artériellerea id="observations" placeholder="Observations"></texTension artériellerea><label>Destination</label><select id="destination"><option>Centre Hospitalier d'Amboise</option><option>Laissé sur place</option></select></div><div class="actions"><button class="btn save" onclick="enregistrerBilan()">💾 Enregistrer</button><button class="btn new" onclick="nouveauBilan()">➕ Nouveau bilan</button><button class="btn pdf" onclick="window.print()">🖨️ Export PDF</button></div><div id="historique" class="card"><h3>Historique</h3><input id="search" placeholder="Recherche par nom" onkeyup="afficherHistorique()"><Tension artérielleble><thead><tr><th>Date</th><th>Nom</th><th>Intervention</th></tr></thead><tbody id="histBody"></tbody></Tension artérielleble></div></div><script>const WEBAPP='https://script.google.com/macros/s/AKfycbxvk-bxEhII5o8VfA0rU96n8-KYvz2FuI9OuMv5318A7hsCMpd9VDbXIaDhNfIXAOsj/exec';function getDaTension artérielle(){return{date:date.value,heure:heure.value,intervention:intervention.value,zone:zone.value,nom:nom.value,prenom:prenom.value,age:age.value,sexe:sexe.value,Fréquence cardiaque:Fréquence cardiaque.value,Tension artérielle:Tension artérielle.value,fr:fr.value,SAT:SAT.value,temperature:temp.value,glycemie:glycemie.value,glasgow:glasgow.value,eva:eva.value,localisation:douleur.value,antecedents:antecedents.value,allergies:allergies.value,traitements:traitements.value,motif:motif.value,observations:observations.value,destination:destination.value}}async function enregistrerBilan(){const b=getDaTension artérielle();let hist=JSON.parse(localStorage.getItem('bilans')||'[]');hist.unshift(b);localStorage.setItem('bilans',JSON.stringify(hist));afficherHistorique();try{await fetch(WEBAPP,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});}catch(e){}alert('Bilan enregistré');}function nouveauBilan(){document.querySelector('form')?.reset();document.querySelectorAll('input,texTension artériellerea').forEach(i=>{if(i.type!='button')i.value=''})}function afficherHistorique(){let hist=JSON.parse(localStorage.getItem('bilans')||'[]');let r=search.value.toLowerCase();hist=hist.filter(x=>(x.nom||'').toLowerCase().includes(r));histBody.innerHTML=hist.map(h=>`<tr><td>${h.date}</td><td>${h.nom} ${h.prenom}</td><td>${h.intervention}</td></tr>`).join('')}window.onload=afficherHistorique;</script></body></html>
