<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche Bilan Pompier</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
    background:#f5f5f5;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    text-align:center;
    color:#c00000;
}

fieldset{
    background:white;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:15px;
    padding:15px;
}

legend{
    font-weight:bold;
    color:#c00000;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:8px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:4px;
}

textarea{
    resize:vertical;
}

.buttons{
    text-align:center;
    margin-top:20px;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.save{
    background:#28a745;
    color:white;
}

.new{
    background:#007bff;
    color:white;
}

.print{
    background:#dc3545;
    color:white;
}

.copy{
    background:#ff9800;
    color:white;
}

@media print{
    button{
        display:none;
    }

    body{
        background:white;
    }
}
</style>

</head>
<body>

<div class="container">

<h1>🚒 Fiche Bilan Pompier</h1>

<form id="bilanForm">

<fieldset>
<legend>Intervention</legend>

<div class="grid">

<div>
<label>Date</label>
<input type="date" id="date">
</div>

<div>
<label>Heure</label>
<input type="time" id="heure">
</div>

<div>
<label>N° Intervention</label>
<input type="text" id="intervention">
</div>

<div>
<label>Zone d'intervention</label>
<input type="text" id="zone">
</div>

</div>
</fieldset>

<fieldset>
<legend>Victime</legend>

<div class="grid">

<div>
<label>Nom</label>
<input type="text" id="nom">
</div>

<div>
<label>Prénom</label>
<input type="text" id="prenom">
</div>

<div>
<label>Âge</label>
<input type="number" id="age">
</div>

<div>
<label>Sexe</label>
<select id="sexe">
<option>Homme</option>
<option>Femme</option>
</select>
</div>

</div>
</fieldset>

<fieldset>
<legend>Constantes</legend>

<div class="grid">

<div>
<label>FC</label>
<input type="text" id="fc">
</div>

<div>
<label>TA</label>
<input type="text" id="ta">
</div>

<div>
<label>FR</label>
<input type="text" id="fr">
</div>

<div>
<label>SpO₂</label>
<input type="text" id="spo2">
</div>

<div>
<label>Température</label>
<input type="text" id="temp">
</div>

<div>
<label>Glycémie</label>
<input type="text" id="glycemie">
</div>

</div>
</fieldset>

<fieldset>
<legend>Évaluation</legend>

<div class="grid">

<div>
<label>Glasgow</label>
<select id="glasgow">
<option>15</option>
<option>14</option>
<option>13</option>
<option>12</option>
<option>11</option>
<option>10</option>
<option>9</option>
<option>8</option>
<option>7</option>
<option>6</option>
<option>5</option>
<option>4</option>
<option>3</option>
</select>
</div>

<div>
<label>EVA Douleur</label>
<select id="eva">
<option>0 - Aucune douleur</option>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10 - Douleur maximale</option>
</select>
</div>

</div>

<div style="margin-top:10px;">
<label>Localisation douleur</label>
<input type="text" id="douleur">
</div>

</fieldset>

<fieldset>
<legend>Médical</legend>

<label>Antécédents</label>
<textarea id="antecedents" rows="3"></textarea>

<label>Allergies</label>
<textarea id="allergies" rows="3"></textarea>

<label>Traitements habituels</label>
<textarea id="traitements" rows="3"></textarea>

</fieldset>

<fieldset>
<legend>Bilan</legend>

<label>Motif</label>
<textarea id="motif" rows="4"></textarea>

<label>Observations</label>
<textarea id="observations" rows="6"></textarea>

</fieldset>

<fieldset>
<legend>Destination</legend>

<label>Destination</label>
<select id="destination">
<option>CH Amboise</option>
<option>Laissé sur place</option>
</select>

</fieldset>

<div class="buttons">

<button type="button" class="new" onclick="nouveauBilan()">
➕ Nouveau bilan
</button>

<button type="button" class="save" onclick="enregistrerBilan()">
💾 Enregistrer dans Supabase
</button>

<button type="button" class="copy" onclick="copierBilan()">
📋 Copier le bilan
</button>

<button type="button" class="print" onclick="window.print()">
🖨️ Export PDF
</button>

</div>

</form>

</div>

<script>

function nouveauBilan(){
    document.getElementById('bilanForm').reset();
}

function enregistrerLocal(){

    const data = {};

    document.querySelectorAll('input,textarea,select').forEach(el=>{
        data[el.id]=el.value;
    });

    localStorage.setItem(
        "dernier_bilan",
        JSON.stringify(data)
    );

    alert("Bilan sauvegardé.");
}

function copierBilan(){

    let texte = "";

    document.querySelectorAll("input,textarea,select").forEach(el=>{
        texte += el.id + " : " + el.value + "\n";
    });

    navigator.clipboard.writeText(texte);

    alert("Bilan copié.");
}

window.onload = function(){

    const bilan =
        localStorage.getItem("dernier_bilan");

    if(bilan){

        const data = JSON.parse(bilan);

        for(let champ in data){

            const element =
                document.getElementById(champ);

            if(element)
                element.value = data[champ];
        }
    }
}

</script>

</body>
</html>
