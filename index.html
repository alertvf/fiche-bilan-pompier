<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiche Bilan Pompier V6</title><style>body{font-family:Arial;background:#f4f4f4;margin:20px}.container{max-width:1200px;margin:auto}.card{background:#fff;padding:15px;border-radius:8px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,.1)}h1{text-align:center;color:#c00000}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}input,select,textarea{width:100%;padding:8px;box-sizing:border-box}textarea{min-height:80px}.actions{text-align:center}.btn{padding:10px 15px;border:none;border-radius:5px;margin:4px;cursor:pointer;color:#fff}.save{background:#2e7d32}.new{background:#1976d2}.pdf{background:#c62828}.view{background:#6a1b9a}.del{background:#ef6c00}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px}#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7)}#modalbox{background:#fff;max-width:800px;margin:40px auto;padding:20px}@media print{.actions,#historique{display:none}}</style></head><body><div class="container"><h1>🚒 Fiche Bilan Pompier V6</h1><div class="card"><div class="grid"><div><label>Date</label><input type="date" id="date"></div><div><label>Heure</label><input type="time" id="heure"></div><div><label>Numéro intervention</label><input id="intervention"></div><div><label>Zone d'intervention</label><input id="zone"></div></div></div><div class="card"><h3>Victime</h3><div class="grid"><input id="nom" placeholder="Nom"><input id="prenom" placeholder="Prénom"><input id="age" placeholder="Âge"><select id="sexe"><option>Homme</option><option>Femme</option></select></div></div><div class="card"><h3>Constantes</h3><div class="grid"><input id="fc" placeholder="Fréquence cardiaque (FC)"><input id="ta" placeholder="Tension artérielle (TA)"><input id="fr" placeholder="Fréquence respiratoire (FR)"><input id="sat" placeholder="Saturation en oxygène (SAT)"><input id="temp" placeholder="Température corporelle"><input id="glycemie" placeholder="Glycémie"></div></div><div class="card"><h3>Évaluation</h3><div class="grid"><select id="glasgow"><option>15</option><option>14</option><option>13</option><option>12</option><option>11</option><option>10</option><option>9</option><option>8</option><option>7</option><option>6</option><option>5</option><option>4</option><option>3</option></select><select id="eva"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div><br><input id="douleur" placeholder="Localisation de la douleur"></div><div class="card"><h3>Médical</h3><textarea id="antecedents" placeholder="Antécédents"></textarea><textarea id="allergies" placeholder="Allergies"></textarea><textarea id="traitements" placeholder="Traitements en cours"></textarea></div><div class="card"><h3>Bilan</h3><textarea id="motif" placeholder="Motif d'intervention"></textarea><textarea id="observations" placeholder="Observations"></textarea><select id="destination"><option>Centre Hospitalier d'Amboise</option><option>Laissé sur place</option></select></div><div class="actions"><button class="btn save" onclick="saveBil()">Enregistrer</button><button class="btn new" onclick="newBil()">Nouveau</button><button class="btn pdf" onclick="window.print()">PDF</button></div><div id="historique" class="card"><h3>Historique</h3><input id="search" placeholder="Recherche par nom" onkeyup="renderHist()"><table><thead><tr><th>Date</th><th>Nom</th><th>Intervention</th><th>Actions</th></tr></thead><tbody id="hist"></tbody></table></div></div><div id="modal"><div id="modalbox"><button onclick="modal.style.display='none'">Fermer</button><div id="detail"></div></div></div><script>const WEBAPP='https://script.google.com/macros/s/AKfycbx63elSxOu2Ed287ZORTx6gwp3AltAMlirRoU11hPfP5ddbxcM4EUJsIyNoigUJxdvf/exec';function data(){return{date:date.value,heure:heure.value,intervention:intervention.value,zone:zone.value,nom:nom.value,prenom:prenom.value,age:age.value,sexe:sexe.value,fc:fc.value,ta:ta.value,fr:fr.value,sat:sat.value,temperature:temp.value,glycemie:glycemie.value,glasgow:glasgow.value,eva:eva.value,localisationDouleur:douleur.value,antecedents:antecedents.value,allergies:allergies.value,traitements:traitements.value,motif:motif.value,observations:observations.value,destination:destination.value}}async function saveBil(){let b=data();let h=JSON.parse(localStorage.getItem('bilans')||'[]');h.unshift(b);localStorage.setItem('bilans',JSON.stringify(h));renderHist();try{await fetch(WEBAPP,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});}catch(e){}alert('Bilan enregistré');}function newBil(){document.querySelectorAll('input,textarea').forEach(x=>{if(x.id!='search')x.value=''})}function renderHist(){let h=JSON.parse(localStorage.getItem('bilans')||'[]');let s=(search.value||'').toLowerCase();h=h.filter(x=>(x.nom||'').toLowerCase().includes(s));hist.innerHTML=h.map((b,i)=>`<tr><td>${b.date}</td><td>${b.nom} ${b.prenom}</td><td>${b.intervention}</td><td><button class='btn view' onclick='showBil(${i})'>Voir</button><button class='btn del' onclick='delBil(${i})'>Supprimer</button></td></tr>`).join('')}function showBil(i){let b=JSON.parse(localStorage.getItem('bilans')||'[]')[i];detail.innerHTML='<h2>'+b.nom+' '+b.prenom+'</h2><p><b>Motif:</b> '+b.motif+'</p><p><b>Observations:</b> '+b.observations+'</p><p><b>EVA:</b> '+b.eva+'</p><p><b>Glasgow:</b> '+b.glasgow+'</p><p><b>Destination:</b> '+b.destination+'</p>';modal.style.display='block'}function delBil(i){let h=JSON.parse(localStorage.getItem('bilans')||'[]');h.splice(i,1);localStorage.setItem('bilans',JSON.stringify(h));renderHist()}window.onload=()=>{date.value=new Date().toISOString().split('T')[0];renderHist()}</script></body></html>
