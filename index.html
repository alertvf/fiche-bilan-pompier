<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche Bilan Pompier V6.1</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🚒 Fiche Bilan Pompier V6.1</h1>

        <div class="card">

            <h2>Intervention</h2>

            <div class="grid">

                <div>
                    <label>Date</label>
                    <input type="date" id="date">
                </div>

                <div>
                    <label>Heure</label>
                    <input type="time" id="heure">
                </div>

                <div>
                    <label>Numéro d'intervention</label>
                    <input id="intervention">
                </div>

                <div>
                    <label>Zone d'intervention</label>
                    <input id="zone">
                </div>

            </div>

        </div>

        <div class="card">

            <h2>Victime</h2>

            <div class="grid">

                <div>
                    <label>Nom</label>
                    <input id="nom">
                </div>

                <div>
                    <label>Prénom</label>
                    <input id="prenom">
                </div>

                <div>
                    <label>Âge</label>
                    <input id="age">
                </div>

                <div>
                    <label>Sexe</label>
                    <select id="sexe">
                        <option>Homme</option>
                        <option>Femme</option>
                    </select>
                </div>

            </div>

        </div>

        <div class="card">

            <h2>Constantes</h2>

            <div class="grid">

                <input id="fc" placeholder="Fréquence cardiaque (FC)">
                <input id="ta" placeholder="Tension artérielle">
                <input id="fr" placeholder="Fréquence respiratoire">
                <input id="sat" placeholder="Saturation en oxygène">
                <input id="temp" placeholder="Température corporelle">
                <input id="glycemie" placeholder="Glycémie">

            </div>

        </div>

        <div class="card">

            <h2>Évaluation</h2>

            <div class="grid">

                <div>
                    <label>Score de Glasgow</label>
                    <select id="glasgow">
                        <option>15</option>
                        <option>14</option>
                        <option>13</option>
                        <option>12</option>
                        <option>11</option>
                        <option>10</option>
                        <option>9</option>
                        <option>8</option>
                        <option>7</option>
                        <option>6</option>
                        <option>5</option>
                        <option>4</option>
                        <option>3</option>
                    </select>
                </div>

                <div>
                    <label>EVA Douleur</label>
                    <select id="eva">
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option>10</option>
                    </select>
                </div>

            </div>

            <br>

            <input
                id="douleur"
                placeholder="Localisation de la douleur">

        </div>

        <div class="card">

            <h2>Médical</h2>

            <textarea
                id="antecedents"
                placeholder="Antécédents"></textarea>

            <textarea
                id="allergies"
                placeholder="Allergies"></textarea>

            <textarea
                id="traitements"
                placeholder="Traitements en cours"></textarea>

        </div>

        <div class="card">

            <h2>Bilan</h2>

            <textarea
                id="motif"
                placeholder="Motif d'intervention"></textarea>

            <textarea
                id="observations"
                placeholder="Observations"></textarea>

            <label>Destination</label>

            <select id="destination">
                <option>Centre Hospitalier d'Amboise</option>
                <option>Laissé sur place</option>
            </select>

        </div>

        <div class="actions">

            <button onclick="saveBil()">
                💾 Enregistrer
            </button>

            <button onclick="newBil()">
                ➕ Nouveau
            </button>

            <button onclick="window.print()">
                🖨️ PDF
            </button>

        </div>

        <div id="historique" class="card">

            <h2>Historique</h2>

            <input
                id="search"
                placeholder="Recherche par nom"
                onkeyup="renderHistorique()">

            <table>

                <thead>
                    <tr>
    <th>N° Intervention</th>
    <th>Nom</th>
    <th>Zone</th>
    <th>Actions</th>
</tr>
                </thead>

                <tbody id="histBody"></tbody>

            </table>

        </div>

    </div>

    <div id="modal" class="modal">

        <div class="modal-content">

            <span
                class="close"
                onclick="closeModal()">
                ×
            </span>

            <div id="modalContent"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
