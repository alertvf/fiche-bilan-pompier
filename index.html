<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fiche Bilan Pompier V5</title><style>body{font-family:Arial,sans-serif;background:#f4f4f4;margin:20px}.container{max-width:1200px;margin:auto}.card{background:#fff;border-radius:8px;padding:15px;margin-bottom:15px;box-shadow:0 2px 5px rgba(0,0,0,.1)}h1{text-align:center;color:#c00000}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}input,select,textarea{width:100%;padding:8px;box-sizing:border-box}textarea{min-height:90px}.actions{text-align:center}.btn{border:none;border-radius:5px;padding:10px 15px;cursor:pointer;margin:5px;font-weight:bold}.save{background:#2e7d32;color:#fff}.new{background:#1976d2;color:#fff}.pdf{background:#c62828;color:#fff}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px}th{background:#eee}@media print{.actions,#historique{display:none}}</style></head><body><div class="container"><h1>🚒 Fiche Bilan Pompier V5</h1><div class="card"><div class="grid"><input type="date" id="date"><input type="time" id="heure"><input id="intervention" placeholder="Intervention"><input id="zone" placeholder="Zone"></div></div><div class="card"><div class="grid"><input id="nom" placeholder="Nom"><input id="prenom" placeholder="Prénom"><input id="age" placeholder="Âge"><select id="sexe"><option>Homme</option><option>Femme</option></select></div></div><div class="card"><div class="grid"><input id="fc" placeholder="FC"><input id="ta" placeholder="TA"><input id="fr" placeholder="FR"><input id="sat" placeholder="SAT"><input id="temp" placeholder="Température"><input id="glycemie" placeholder="Glycémie"></div></div><div class="card"><textarea id="motif" placeholder="Motif"></textarea><textarea id="observations" placeholder="Observations"></textarea></div><div class="actions"><button class="btn save" onclick="enregistrerBilan()">💾 Enregistrer</button><button class="btn new" onclick="location.reload()">➕ Nouveau</button><button class="btn pdf" onclick="window.print()">🖨️ PDF</button></div></div><script>const WEBAPP='https://script.google.com/macros/s/AKfycbx63elSxOu2Ed287ZORTx6gwp3AltAMlirRoU11hPfP5ddbxcM4EUJsIyNoigUJxdvf/exec';async function enregistrerBilan(){const b={date:date.value,heure:heure.value,intervention:intervention.value,zone:zone.value,nom:nom.value,prenom:prenom.value,age:age.value,sexe:sexe.value,fc:fc.value,ta:ta.value,fr:fr.value,sat:sat.value,temperature:temp.value,glycemie:glycemie.value,motif:motif.value,observations:observations.value};localStorage.setItem('dernierBilan',JSON.stringify(b));try{await fetch(WEBAPP,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});}catch(e){}alert('Bilan enregistré');}date.value=new Date().toISOString().split('T')[0];</script></body></html>
